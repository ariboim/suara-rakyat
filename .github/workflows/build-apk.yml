name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "ERROR: debug.keystore could not be created."
            exit 1
          fi
          echo "Debug keystore is ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Expected APK not found at $APK_PATH"
            echo "Searching in app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK file is empty."
            exit 1
          fi
          echo "Found verified APK: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"
          if [ ! -s "$TMP_DIR/app-debug.apk" ]; then
            echo "ERROR: Prepared APK is missing or empty."
            exit 1
          fi
          echo "apk_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          PREPARED_APK="${{ steps.prepare_asset.outputs.apk_path }}"
          if [ ! -s "$PREPARED_APK" ]; then
            echo "ERROR: Release asset $PREPARED_APK is missing or empty."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          gh release create "$RELEASE_TAG" "$PREPARED_APK" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes "### Automated Debug APK Build
          - **Run Number**: #${{ github.run_number }}
          - **Run Attempt**: #${{ github.run_attempt }}
          - **Commit**: \`${{ github.sha }}\`
          - **Type**: Debug APK (Testing purposes only, signed with temporary debug keystore)."
